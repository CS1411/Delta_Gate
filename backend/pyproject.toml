[project]
name = "deltagate"
version = "0.1.0"
description = "Delta Gate: an independent check for AI spreadsheet edits"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "mcp[cli]",
    "openpyxl",
    "networkx",
    "pycel==1.0b30",   # the version our allowlist was tested against
    "formulas",
    "cryptography",
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "hypothesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [  # pycel 1.0b30 on Python 3.12: thousands of these per run
    "ignore:ast.Str is deprecated:DeprecationWarning",
    "ignore:Attribute s is deprecated:DeprecationWarning",
]
